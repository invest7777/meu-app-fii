name: Telegram Automatico Diario

on:
  schedule:
    # Executa todos os dias às 09:00 BRT (12:00 UTC)
    - cron: '0 12 * * *' 
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixando codigo do GitHub
        uses: actions/checkout@v3

      - name: Instalando Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalando Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pyTelegramBotAPI pandas

      - name: Executando o Robo
        env:
          # Se você usa variáveis secretas (Token do Bot), adicione aqui:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bot_telegram.py
