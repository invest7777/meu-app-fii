name: Telegram Automatico Diario

on:
  schedule:
    # Executa todos os dias às 09:00 BRT (12:00 UTC)
    - cron: '0 12 * * *' 
  workflow_dispatch: # Permite que você clique no botão "Run Workflow" para testar agora

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixando codigo do GitHub
        uses: actions/checkout@v3

      - name: Instalando Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalando Bibliotecas (Gráficos e Finanças)
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pyTelegramBotAPI pandas matplotlib

      - name: Executando o App de Banco
        run: python bot_telegram.py
